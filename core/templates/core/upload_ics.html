{% extends 'core/base.html' %}

{% block content %}
<div class="container">
    <h2>Upload Calendar File for {{ customer.company_name }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Upload</button>
    </form>

    <a href="{% url 'customer-calendar' customer.id %}" class="btn btn-secondary mt-3">View Calendar</a>
</div>
{% endblock %}
