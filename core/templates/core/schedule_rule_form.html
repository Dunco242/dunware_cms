{% extends 'core/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
    <h1>{% if form.instance.pk %}Edit{% else %}Create{% endif %} Scheduling Rule</h1>

    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}

        <button type="submit" class="btn btn-primary">
            Save Rule
        </button>
        <a href="{% url 'schedule-rule-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
