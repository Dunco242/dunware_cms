{% extends 'customer_projects/base_projects.html' %}
{% load crispy_forms_tags %}

{% block project_content %}
<div class="card">
    <div class="card-header">
        <h4 class="card-title mb-0">
            {% if form.instance.pk %}
                Edit Report
            {% else %}
                Create New Report
            {% endif %}
        </h4>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">
                    {% if form.instance.pk %}Update{% else %}Create{% endif %} Report
                </button>
                <a href="{% url 'customer_projects:project-detail' project.id %}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
