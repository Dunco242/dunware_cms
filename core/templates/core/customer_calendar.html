{% extends 'core/base.html' %}
{% load static %}

{% block title %}{{ customer.company_name }} Calendar{% endblock %}

{% block extra_css %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
<style>
    #customer-calendar {
        max-width: 100%;
        height: 650px;
    }
    .fc-event {
        cursor: pointer;
        white-space: normal !important;
        word-wrap: break-word !important;
        line-height: 1.2 !important;
        padding: 2px 4px !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary">
                Calendar for {{ customer.company_name }}
            </h6>
            <div class="btn-group">
                <a href="{% url 'customer-event-create' customer.pk %}" class="btn btn-primary btn-sm">
                    <i class="fas fa-plus"></i> New Event
                </a>
                <a href="{% url 'customer-upload-ics' customer.pk %}" class="btn btn-secondary btn-sm">
                    <i class="fas fa-upload"></i> Upload ICS
                </a>
            </div>
        </div>
        <div class="card-body">
            <div id="customer-calendar"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('customer-calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 'auto',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: "{% url 'customer-calendar-events' customer.pk %}",
        editable: true,
        selectable: true,
        selectMirror: true,
        dayMaxEvents: true,

        eventContent: function(arg) {
            let eventEl = document.createElement('div');
            eventEl.classList.add('fc-event-custom');

            // Helper function to determine text color
            function getContrastYIQ(hexcolor) {
                hexcolor = hexcolor.replace("#", "");
                var r = parseInt(hexcolor.substr(0,2), 16);
                var g = parseInt(hexcolor.substr(2,2), 16);
                var b = parseInt(hexcolor.substr(4,2), 16);
                var yiq = ((r*299)+(g*587)+(b*114))/1000;
                return (yiq >= 128) ? 'black' : 'white';
            }

            const bgColor = arg.event.backgroundColor || '#3788d8';
            const textColor = getContrastYIQ(bgColor);

            eventEl.style.backgroundColor = bgColor;
            eventEl.style.color = textColor;
            eventEl.style.padding = '4px';
            eventEl.style.borderRadius = '3px';
            eventEl.style.display = 'block';
            eventEl.style.width = '100%';
            eventEl.style.wordWrap = 'break-word';
            eventEl.style.whiteSpace = 'normal';

            let titleSpan = document.createElement('span');
            titleSpan.textContent = arg.event.title;
            titleSpan.style.display = 'block';
            titleSpan.style.fontWeight = 'bold';

            eventEl.appendChild(titleSpan);

            if (arg.event.extendedProps.customer) {
                let customerSpan = document.createElement('small');
                customerSpan.textContent = `📋 ${arg.event.extendedProps.customer}`;
                customerSpan.style.display = 'block';
                customerSpan.style.opacity = '0.8';

                eventEl.appendChild(customerSpan);
            }

            return { domNodes: [eventEl] };
        },

        select: function(info) {
            var result = confirm(`Create a new event from ${info.startStr} to ${info.endStr}?`);
            if (result) {
                window.location.href = `{% url 'customer-event-create' customer.pk %}?start=${info.startStr}&end=${info.endStr}`;
            }
            calendar.unselect();
        }
    });

    calendar.render();
});
</script>
{% endblock %}
