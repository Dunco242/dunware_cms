{% block extra_js %}
<!-- Load React and other dependencies -->
<script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/slate@0.63.0/dist/slate.js" crossorigin></script>
<script src="https://unpkg.com/slate-react@0.63.0/dist/slate-react.js" crossorigin></script>
<script src="https://unpkg.com/slate-history@0.63.0/dist/slate-history.js" crossorigin></script>
<script src="https://unpkg.com/is-hotkey@0.2.0/umd/is-hotkey.js" crossorigin></script>
<script src="https://unpkg.com/lodash@4.17.21/lodash.min.js" crossorigin></script>

<!-- Load our editor as a module -->
<script type="module" src="{% static 'document_editor/js/slate-editor.js' %}"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const editorContainer = document.getElementById('slate-editor');
    const debugMessage = document.getElementById('editor-debug');
    const connectionStatus = document.getElementById('connection-status');
    const activeUsersContainer = document.getElementById('active-users');
    const documentId = document.getElementById('document-id').value;

    // WebSocket setup
    let socket;
    let pingInterval;
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 5;

    // Initialize WebSocket connection
    function initWebSocket() {
      // Detect if we should use secure WebSockets (wss) or not (ws)
      const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const wsUrl = `${protocol}://${window.location.host}/wss/documents/${documentId}/`;

      // Update status
      if (connectionStatus) {
        connectionStatus.className = 'connection-status connecting';
        connectionStatus.innerHTML = '<i class="fas fa-circle"></i> Connecting...';
      }

      // Create WebSocket
      socket = new WebSocket(wsUrl);

      // Export socket to window for editor to use
      window.documentSocket = socket;

      // Handle WebSocket events
      socket.onopen = function(e) {
        console.log('WebSocket connection established');
        if (connectionStatus) {
          connectionStatus.className = 'connection-status connected';
          connectionStatus.innerHTML = '<i class="fas fa-circle"></i> Online';
        }
        reconnectAttempts = 0;

        // Set up ping interval to keep connection alive
        pingInterval = setInterval(() => {
          if (socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({type: 'ping'}));
          }
        }, 30000); // Send ping every 30 seconds
      };

      socket.onclose = function(e) {
        console.log('WebSocket connection closed', e);
        if (connectionStatus) {
          connectionStatus.className = 'connection-status disconnected';
          connectionStatus.innerHTML = '<i class="fas fa-circle"></i> Offline';
        }
        clearInterval(pingInterval);

        // Attempt to reconnect if not closed intentionally
        if (e.code !== 1000 && reconnectAttempts < maxReconnectAttempts) {
          reconnectAttempts++;
          const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
          console.log(`Attempting to reconnect in ${delay/1000} seconds... (Attempt ${reconnectAttempts})`);
          setTimeout(initWebSocket, delay);
        }
      };

      socket.onerror = function(e) {
        console.error('WebSocket error:', e);
        if (connectionStatus) {
          connectionStatus.className = 'connection-status disconnected';
          connectionStatus.innerHTML = '<i class="fas fa-circle"></i> Offline';
        }
      };
    }

    if (editorContainer) {
      try {
        if (!editorContainer.innerHTML.trim()) {
          debugMessage.innerText = "Slate.js is initializing...";
        }

        setTimeout(() => {
          if (!editorContainer.innerHTML.trim()) {
            debugMessage.innerText = "Slate.js failed to load! Check console.";
          } else {
            debugMessage.innerText = "";

            // Initialize WebSocket connection
            initWebSocket();
          }
        }, 5000);
      } catch (error) {
        console.error('Error initializing document editor:', error);
        debugMessage.innerText = "Error initializing document editor. Please refresh the page.";
      }
    }

    // Clean up on page unload
    window.addEventListener('beforeunload', () => {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.close(1000, "Page closed by user");
      }
      clearInterval(pingInterval);
    });
  });
</script>
{% endblock %}
