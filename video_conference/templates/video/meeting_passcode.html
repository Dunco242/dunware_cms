<!-- templates/video/meeting_passcode.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DunWare CRM - Meeting Passcode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #0d6efd;
            padding: 0.8rem 1rem;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
            font-size: 1.5rem;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            max-width: 500px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            background-color: #0d6efd;
            color: white;
            border-radius: 10px 10px 0 0 !important;
            padding: 20px;
        }

        .card-title {
            margin-bottom: 0;
            font-size: 1.5rem;
        }

        .card-body {
            padding: 30px;
        }

        .form-control {
            padding: 12px;
            font-size: 1rem;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
            padding: 12px;
            font-size: 1rem;
        }

        .footer {
            background-color: #f1f1f1;
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }

        .guest-form {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-cube"></i> DunWare CRM
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title"><i class="fas fa-lock me-2"></i>Meeting Access</h5>
            </div>
            <div class="card-body">
                <h5>{{ meeting.title }}</h5>
                <p class="text-muted">{{ meeting.start_time|date:"F d, Y P" }}</p>

                {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="passcode" class="form-label">Please enter the meeting passcode:</label>
                        <input type="password" class="form-control" id="passcode" name="passcode" placeholder="Enter passcode" required>
                    </div>

                    <!-- Guest name field if not logged in -->
                    {% if not user.is_authenticated %}
                    <div class="guest-form">
                        <label for="display_name" class="form-label">Your Name:</label>
                        <input type="text" class="form-control" id="display_name" name="display_name" placeholder="Enter your name" required>
                    </div>
                    {% endif %}

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Join Meeting</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container text-center">
            <span class="text-muted">© {% now "Y" %} DunWare CRM. All rights reserved.</span>
        </div>
    </footer>
</body>
</html>
