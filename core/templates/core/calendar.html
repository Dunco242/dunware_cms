{% extends 'core/base.html' %}
{% load humanize %}

{% block title %}My Calendar{% endblock %}

{% block extra_css %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.css' rel='stylesheet' />
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary">My Calendar</h6>
            <div class="btn-group">
                <a href="{% url 'task-create' %}" class="btn btn-sm btn-outline-primary">
                    <i class="fas fa-tasks"></i> New Task
                </a>
                <a href="{% url 'meeting-create' %}" class="btn btn-sm btn-outline-primary">
                    <i class="fas fa-video"></i> New Meeting
                </a>
            </div>
        </div>
        <div class="card-body">
            <div id="user-calendar"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.js'></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('user-calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 'auto',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: "{% url 'user-calendar-events' %}",
        editable: true,
        selectable: true,
        select: function(info) {
            // Show a modal to choose between creating a task or meeting
            $('#event-type-modal').modal('show');
        },
        eventClick: function(info) {
            window.location.href = info.event.url;
        },
        eventContent: function(arg) {
            return {
                html: `
                    <div class="fc-content">
                        <i class="fas ${arg.event.extendedProps.icon}"></i>
                        <span>${arg.event.title}</span>
                        ${arg.event.extendedProps.customer ?
                          `<small class="d-block text-muted">📋 ${arg.event.extendedProps.customer}</small>` : ''}
                    </div>
                `
            };
        }
    });
    calendar.render();
});
</script>
{% endblock %}
