{% extends 'core/base.html' %}
{% block title %}Confirm Task Deletion{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-danger text-white">
            <h5 class="m-0"><i class="fas fa-trash"></i> Confirm Task Deletion</h5>
        </div>
        <div class="card-body text-center">
            <p>Are you sure you want to delete the task <strong>"{{ task.title }}"</strong>?</p>
            <p class="text-muted">This action cannot be undone.</p>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Delete</button>
                <a href="{% url 'task-list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
