<!-- templates/video/meeting_ended.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DunWare CRM - Meeting Ended</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #0d6efd;
            padding: 0.8rem 1rem;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
            font-size: 1.5rem;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            max-width: 500px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            background-color: #3f51b5;
            color: white;
            border-radius: 10px 10px 0 0 !important;
            padding: 20px;
        }

        .card-title {
            margin-bottom: 0;
            font-size: 1.5rem;
        }

        .card-body {
            padding: 30px;
        }

        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
            padding: 10px 20px;
        }

        .footer {
            background-color: #f1f1f1;
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-cube"></i> DunWare CRM
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title"><i class="fas fa-hourglass-end me-2"></i>Meeting Has Ended</h5>
            </div>
            <div class="card-body">
                <p class="card-text">The meeting you're trying to join has already ended.</p>
                <p><strong>Meeting title:</strong> {{ meeting.title }}</p>
                <p><strong>Scheduled time:</strong> {{ meeting.start_time|date:"F d, Y P" }} to {{ meeting.end_time|date:"P" }}</p>

                <div class="text-center mt-4">
                    <a href="/" class="btn btn-primary">Return to Homepage</a>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container text-center">
            <span class="text-muted">© {% now "Y" %} DunWare CRM. All rights reserved.</span>
        </div>
    </footer>
</body>
</html>
