<!DOCTYPE html>
<html>
<head>
    <title>Simplified Calendar</title>
</head>
<body>
    <select id="participant-select">
        {% for employee in available_employees %}
            <option value="{{ employee.id }}">{{ employee.user.username }}</option>
        {% empty %}
            <option>No Employees Available</option>
        {% endfor %}
    </select>
</body>
</html>
