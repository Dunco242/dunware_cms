<!-- templates/core/errors/500.html -->
{% extends 'core/base.html' %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="text-center mt-5">
                <div class="error-icon mb-4">
                    <i class="fas fa-cogs fa-4x text-danger"></i>
                </div>
                <h1 class="display-1">500</h1>
                <p class="lead">Server Error</p>
                <p class="text-muted mb-4">Something went wrong on our end. We are working to fix the issue. Please try again later.</p>
                <div class="mb-4">
                    <a href="{% url 'dashboard' %}" class="btn btn-primary me-2">
                        <i class="fas fa-home me-2"></i>Return to Dashboard
                    </a>
                    <button onclick="location.reload()" class="btn btn-outline-primary">
                        <i class="fas fa-sync-alt me-2"></i>Refresh Page
                    </button>
                </div>
                <p class="small text-muted">If the problem persists, please contact support.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
