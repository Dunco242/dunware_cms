{% extends 'core/base.html' %}

{% block title %}Delete Meeting{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow">
            <div class="card-header bg-danger text-white">
                <h6 class="m-0 font-weight-bold">Confirm Meeting Deletion</h6>
            </div>
            <div class="card-body">
                <p>Are you sure you want to delete the meeting <strong>"{{ meeting.title }}"</strong> scheduled for <strong>{{ meeting.start_time }}</strong>?</p>
                <p>This action <strong>cannot be undone.</strong></p>

                <form method="post">
                    {% csrf_token %}

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'meeting-list' %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash"></i> Delete Meeting
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
