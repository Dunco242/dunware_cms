{% extends 'core/base.html' %}

{% block content %}
<div class="container">
    <h1>Delete Scheduling Rule</h1>
    <p>Are you sure you want to delete the rule "{{ object.name }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
        <a href="{% url 'schedule-rule-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
